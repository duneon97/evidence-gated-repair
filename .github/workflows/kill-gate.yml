name: day-1-kill-gate

# Manual only. Proves the repository can reach Muse Spark Open through the HF router
# using repository secrets, without ever printing a secret value.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id on the HF Inference router
        required: false
        default: meta-models/Muse-Spark-Open-816B-A42B
      repeats:
        description: Two-turn tool loops to run
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_BASE_URL: https://router.huggingface.co/v1
      MODEL_ID: ${{ inputs.model }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Single-turn probe (main token)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_MAIN }}
        run: |
          python3 tools/probe_model.py \
            --provider hf --model "$MODEL_ID" --runs 2 \
            --out probe-model.json | tee probe-model.log
        continue-on-error: true

      - name: Single-turn probe (fallback token)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_FALLBACK }}
        run: |
          python3 tools/probe_model.py \
            --provider hf --model "$MODEL_ID" --runs 2 \
            --out probe-model-fallback.json | tee probe-model-fallback.log
        continue-on-error: true

      - name: Two-turn tool loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_MAIN }}
        run: |
          python3 tools/probe_tool_loop.py \
            --provider hf --model "$MODEL_ID" --repeats "$REPEATS" \
            --out probe-loop.json | tee probe-loop.log

      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          for name in ("probe-model", "probe-model-fallback", "probe-loop"):
              path = pathlib.Path(f"{name}.json")
              if not path.exists():
                  print(f"{name}: MISSING")
                  continue
              data = json.loads(path.read_text())
              print(f"{name}: verdict={data.get('verdict')} model={data.get('model')} "
                    f"key_present={data.get('key_present')} "
                    f"latency_median={data.get('latency', {}).get('latency_median_s')}s "
                    f"loops={data.get('success_rate', '-')} cost_usd={data.get('total_cost_usd', '-')}")
          PY

      - name: Upload probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kill-gate-probes
          path: |
            probe-model.json
            probe-model-fallback.json
            probe-loop.json
          retention-days: 7
